
services:
  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD in PowerShell}
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.0
    environment:
      ELASTICSEARCH_HOSTS: '["http://es:9200"]'
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD:?Set KIBANA_PASSWORD in PowerShell}
      PACK_SECURITY_ENCRYPTIONKEY: "a6f8f2383dcb0e08fcec309764bfcf0c"
      XPACK_REPORTING_ENCRYPTIONKEY: "7abc2128ca92cffe02da48af58e48a41"
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: "1b13036283815ca32c4e106629b980b6"
    ports:
      - "5601:5601"
    depends_on:
      - es
    

volumes:
  esdata:


